# Fedora CoreOS (FCOS) Specific GitHub Actions Workflow
#
# This action workflow is triggered on branches starting fedora* or tags ending
# *fedora. It builds all current driver version ('branches' in NVIDIA parlance)
# and has an optional toggle for whether or not to precompile kernel module headers.
# It also supports publishing of build images to a registry via repository secrets.
# The workflow is run on self-hosted FedoraCoreOS github-runners with specific tags:
# - pdm-k1-arc-fcos-next, pdm-k1-arc-fcos-testing, pdm-k1-arc-fcos-stable
# - https://github.com/actions/actions-runner-controller

name: FedoraCoreOS Main Image Build/Publish

on:
  push:
    branches:
      - 'fedora*'
      - '*fedora'
    tags:
      - '*fedora'
  pull_request:
    branches:
      - 'fedora**'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      overwrite_remote_tags:
        description: 'Force overwrite remote tags'
        required: false
        default: false
        type: boolean
      compile_kernel_modules:
        description: 'Compile kernel modules'
        required: false
        default: true
        type: boolean

env:
  # Driver versions to build
  DRIVER_VERSIONS: "535.274.02 570.195.03 580.95.05"
  CUDA_VERSION: "12.8.1"
  GOLANG_VERSION: "1.25.2"
  CVE_UPDATES: "curl libc6"
  COMPILE_KERNEL_MODULES: ${{ github.event.inputs.compile_kernel_modules || '1' }}
  OVERWRITE_REMOTE_TAGS: ${{ github.event.inputs.overwrite_remote_tags || '0' }}
  OVERWRITE_TAGS: "1"

jobs:
  # Production container image builds for fedora branches/tags (all supported NVIDIA driver versions)
  build-scan:
    if: ${{ startsWith(github.ref_name, 'fedora') || endsWith(github.ref, 'fedora') || github.event_name == 'schedule' }}
    runs-on: ${{ fromJSON(format('["pdm-k1-arc-fcos-{0}"]', matrix.stream)) }}
    strategy:
      matrix:
        stream: [next, testing, stable]
      fail-fast: false
    steps:
      - name: Checkout code
        if: ${{ github.event_name != 'schedule' }}
        uses: actions/checkout@v4

      - name: Checkout code (scheduled)
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/checkout@v4
        with:
          ref: fedora-rebased-main

      - name: Set environment variables
        run: |
          echo "FEDORA_VERSION=$(uname -r | sed -r 's/^.*fc([0-9][0-9]).*/\1/')" >> $GITHUB_ENV
          echo "FEDORA_UNAME=$(uname -r)" >> $GITHUB_ENV
          echo "IMAGE_BASE_NAME=ghcr.io/${{ github.repository_owner }}/driver" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production images
        run: |
          for driver_version in $DRIVER_VERSIONS; do
            ./ci/fedora/build_push_image.sh \
              "$driver_version" \
              "$OVERWRITE_TAGS" \
              "" \
              "$FEDORA_VERSION" \
              "$FEDORA_UNAME" \
              "$IMAGE_BASE_NAME" \
              "$COMPILE_KERNEL_MODULES"
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.stream }}
          path: /tmp/kernel-module-build*.log
          retention-days: 7

      # - name: Run Trivy vulnerability scanner
      #   uses: aquasecurity/trivy-action@0.33.1
      #   with:
      #     image-ref: ${{ env.IMAGE_BASE_NAME }}:${{ env.COMMIT_SHORT_SHA }}-${{ env.DRIVER_VERSION }}-${{ env.FEDORA_UNAME }}-fedora${{ env.FEDORA_VERSION }}
      #     format: 'sarif'
      #     output: 'trivy-results.sarif'
      #     timeout: 30m0s

      # - name: Scan production images
      #   run: |
      #     for driver_version in $DRIVER_VERSIONS; do
      #       ./ci/fedora/scan_image.sh \
      #         "$driver_version" \
      #         "" \
      #         "$FEDORA_VERSION" \
      #         "$FEDORA_UNAME" \
      #         "$IMAGE_BASE_NAME"
      #     done

  # Release only on tags ending with 'fedora'
  release:
    environment: ACTIONS_RUNNER_DEBUG
    if: ${{ endsWith(github.ref, 'fedora') || github.event_name == 'schedule' }}
    needs: [build-scan]
    runs-on: ${{ fromJSON(format('["pdm-k1-arc-fcos-{0}"]', matrix.stream)) }}
    strategy:
      matrix:
        stream: [next, testing, stable]
      fail-fast: false
    steps:
      - name: Checkout code
        if: ${{ github.event_name != 'schedule' }}
        uses: actions/checkout@v4

      - name: Checkout code (scheduled)
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/checkout@v4
        with:
          ref: fedora-rebased-main

      - name: Set environment variables
        run: |
          echo "FEDORA_VERSION=$(uname -r | sed -r 's/^.*fc([0-9][0-9]).*/\1/')" >> $GITHUB_ENV
          echo "FEDORA_UNAME=$(uname -r)" >> $GITHUB_ENV
          echo "IMAGE_BASE_NAME=ghcr.io/${{ github.repository_owner }}/driver" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub Container Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.RELEASE_REGISTRY_USER }}
          password: ${{ secrets.RELEASE_REGISTRY_TOKEN }}

      - name: Release images
        env:
          RELEASE_REGISTRY_PROJECT: ${{ secrets.RELEASE_REGISTRY_PROJECT }}
        run: |

          echo "Releasing to project: $RELEASE_REGISTRY_PROJECT"

          for driver_version in $DRIVER_VERSIONS; do
            ./ci/fedora/release_image.sh \
              "$driver_version" \
              "$OVERWRITE_REMOTE_TAGS" \
              "" \
              "$FEDORA_VERSION" \
              "$FEDORA_UNAME" \
              "$IMAGE_BASE_NAME" \
              "$RELEASE_REGISTRY_PROJECT"
          done

