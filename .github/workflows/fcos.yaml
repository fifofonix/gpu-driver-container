  # Development release (internal registry test)
  release-dev:
    if: ${{ endsWith(github.ref_name, 'fedora-dev') && github.event_name != 'schedule' }}
    needs: scan-dev
    runs-on: pdm-k1-arc-fcos-next
    container:
      image: docker:27.3
      options: --privileged
    services:
      docker:
        image: docker:27.3-dind
        options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "FEDORA_VERSION=$(uname -r | sed -r 's/^.*fc([0-9][0-9]).*/\1/')" >> $GITHUB_ENV
          echo "FEDORA_UNAME=$(uname -r)" >> $GITHUB_ENV
          echo "IMAGE_BASE_NAME=ghcr.io/${{ github.repository_owner }}/driver" >> $GITHUB_ENV
          echo "COMMIT_SHORT_SHA=${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Development release (test)
        run: |
          DRIVER_VERSION=$(echo $DRIVER_VERSIONS | awk '{print $NF}')
          ./ci/fedora/release_image.sh \
            "$DRIVER_VERSION" \
            "$OVERWRITE_REMOTE_TAGS" \
            "${COMMIT_SHORT_SHA}-" \
            "$FEDORA_VERSION" \
            "$FEDORA_UNAME" \
            "$IMAGE_BASE_NAME" \
            "$IMAGE_BASE_NAME"

