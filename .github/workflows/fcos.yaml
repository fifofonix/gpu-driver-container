  # Security scanning
  scan-dev:
    if: ${{ endsWith(github.ref_name, 'fedora-dev') && github.event_name != 'schedule' }}
    needs: build-dev
    runs-on: pdm-k1-arc-fcos-next
    container:
      image: registry.gitlab.com/security-products/container-scanning:7
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "FEDORA_VERSION=$(uname -r | sed -r 's/^.*fc([0-9][0-9]).*/\1/')" >> $GITHUB_ENV
          echo "FEDORA_UNAME=$(uname -r)" >> $GITHUB_ENV
          echo "IMAGE_BASE_NAME=ghcr.io/${{ github.repository_owner }}/driver" >> $GITHUB_ENV
          echo "COMMIT_SHORT_SHA=${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Scan development image
        run: |
          DRIVER_VERSION=$(echo $DRIVER_VERSIONS | awk '{print $NF}')
          ./ci/fedora/scan_image.sh \
            "$DRIVER_VERSION" \
            "${COMMIT_SHORT_SHA}-" \
            "$FEDORA_VERSION" \
            "$FEDORA_UNAME" \
            "$IMAGE_BASE_NAME"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-scan-results
          path: driver-artifacts/
          retention-days: 30

