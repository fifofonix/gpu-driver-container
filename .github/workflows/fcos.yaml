# Fedora CoreOS (FCOS) Specific GitHub Actions Workflow
#
# This workflow is designed for FedoraCoreOS container images with pre-built kernel
# packages. It uses self-hosted ARC runners tagged with:
# - self-hosted, pdm-k1-arc-fcos-testing, pdm-k1-arc-fcos-stable

name: FedoraCoreOS Driver Build

on:
  push:
    branches:
      - 'fedora**'
      - '*fedora'
    tags:
      - '*fedora'
  pull_request:
    branches:
      - 'fedora**'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      overwrite_remote_tags:
        description: 'Force overwrite remote tags'
        required: false
        default: false
        type: boolean
      compile_kernel_modules:
        description: 'Compile kernel modules'
        required: false
        default: true
        type: boolean

env:
  # Driver versions to build
  DRIVER_VERSIONS: "535.261.03 570.172.08 580.65.06"
  CUDA_VERSION: "12.8.1"
  GOLANG_VERSION: "1.24.5"
  CVE_UPDATES: "curl libc6"
  COMPILE_KERNEL_MODULES: ${{ github.event.inputs.compile_kernel_modules || '1' }}
  OVERWRITE_REMOTE_TAGS: ${{ github.event.inputs.overwrite_remote_tags || '0' }}
  OVERWRITE_TAGS: "1"

jobs:
  # Development build for non-fedora branches (single build on next)
  build-dev:
    if: ${{ endsWith(github.ref_name, 'fedora-dev') && github.event_name != 'schedule' }}
    runs-on: pdm-k1-arc-fcos-next
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "FEDORA_VERSION=$(uname -r | sed -r 's/^.*fc([0-9][0-9]).*/\1/')" >> $GITHUB_ENV
          echo "FEDORA_UNAME=$(uname -r)" >> $GITHUB_ENV
          echo "IMAGE_BASE_NAME=ghcr.io/${{ github.repository_owner }}/driver" >> $GITHUB_ENV
          echo "COMMIT_SHORT_SHA=${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push development image
        run: |
          # Use only the latest driver version for dev builds
          DRIVER_VERSION=$(echo $DRIVER_VERSIONS | awk '{print $NF}')

          ./ci/fedora/build_push_image.sh \
            "$DRIVER_VERSION" \
            "$OVERWRITE_TAGS" \
            "${COMMIT_SHORT_SHA}-" \
            "$FEDORA_VERSION" \
            "$FEDORA_UNAME" \
            "$IMAGE_BASE_NAME" \
            "$COMPILE_KERNEL_MODULES"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-logs
          path: /tmp/kernel-module-build*.log
          retention-days: 7

